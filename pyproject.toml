[project]
name = "herald-watch"
version = "0.1.0"
description = "Local CLI that watches creator posts and JavDB release codes, then notifies Telegram."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Herald contributors" }]
keywords = ["cli", "telegram", "feed", "javdb"]

[project.urls]
Homepage = "https://github.com/alotie418/herald"
Repository = "https://github.com/alotie418/herald"
Issues = "https://github.com/alotie418/herald/issues"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
herald = "herald.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herald"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
